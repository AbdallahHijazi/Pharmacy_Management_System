services:
  - type: web
    name: pharmacy-backend
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: pharmacy-db
          property: connectionString

databases:
  - name: pharmacy-db
    plan: free
    region: oregon
